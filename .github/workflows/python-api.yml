name: Python API

on:
  workflow_dispatch:
  push:
    branches: [main, python-api-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cbsrmt
      AUTH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest --cov=cbsrmt_api --cov-report=term-missing

      - name: Lint
        run: ruff check src tests

      - name: Install database contract
        run: |
          git clone --depth 1 --branch postgresql-v1 https://github.com/phpwalter/cbsrmt.db.git ../cbsrmt.db
          bash ../cbsrmt.db/install/fresh_install.sh --host localhost --port 5432 --database cbsrmt --user postgres

      - name: Integration smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from cbsrmt_api.main import create_app

          with TestClient(create_app()) as client:
              ping = client.get('/ping')
              assert ping.status_code == 200, ping.text
              assert ping.json()['status'] == 'ok'

              ep = client.get('/episodes/1')
              assert ep.status_code == 200, ep.text
              assert ep.json()['episode_number'] == 1

              listing = client.get('/episodes', params={'limit': 5})
              assert listing.status_code == 200, listing.text
              assert listing.json()['pagination']['total'] == 1399
          PY
